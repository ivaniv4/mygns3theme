name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    name: Self-test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: windows-latest, python: "3.8" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Render every theme and patch the official GNS3 sources
        run: python mygns3theme.py selftest

  qt-styles:
    name: Apply every theme (PyQt${{ matrix.qt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qt: ["5", "6"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install PyQt${{ matrix.qt }}
      - name: Run the patched style code of every supported GNS3 version
        run: python tests/qt_styles.py ${{ matrix.qt }}

  scripts:
    name: Lint installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck unix/*.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem windows/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($file.Name): $_" }; $failed = $true }
          }
          if ($failed) { exit 1 }

  build:
    name: Build release archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/*

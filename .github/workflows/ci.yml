name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    name: Self-test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Render every theme and patch the official GNS3 sources
        run: python mygns3theme.py selftest --gns3-version 3.1.0a7 --gns3-version 2.2.61

  scripts:
    name: Lint installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck unix/*.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem windows/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($file.Name): $_" }; $failed = $true }
          }
          if ($failed) { exit 1 }

  build:
    name: Build release archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/*
